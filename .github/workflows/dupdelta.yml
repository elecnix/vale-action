name: dupdelta

# Reports only the duplication this change introduces, not what the repository
# already carried. It warns; it never fails the build.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dupdelta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dupdelta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the merge-base has to be reachable
      - uses: elecnix/dupdelta@c95b985a8e9ba75c1473f2fe3695d8478f869d53 # v0.3.0
