name: ci

# Three things are proved here on every change: the verdict logic in unit
# tests, the composite action end to end against the fixture repositories, and
# that no name which must stay private reached this repository.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrub:
    name: no private names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the author-address check reads the whole history
      - run: ./scripts/scrub.sh .

  unit:
    name: verdict logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 scripts/test_vale_action.py

  fixture-clean:
    name: clean prose passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: vale
        uses: ./
        with:
          config: fixtures/clean/.vale.ini
          files: fixtures/clean/docs
          sync: false
          comment: false
          check: false
      - name: The verdict is a pass
        run: |
          set -euo pipefail
          test "${{ steps.vale.outputs.outcome }}" = "success"
          test "${{ steps.vale.outputs.alerts }}" = "0"
          test -n "${{ steps.vale.outputs.vale-version }}"

  fixture-dirty:
    name: bad prose fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: vale
        continue-on-error: true
        uses: ./
        with:
          config: fixtures/dirty/.vale.ini
          files: fixtures/dirty/docs
          sync: false
          comment: false
          check: false
      - name: The step went red and the verdict says why
        run: |
          set -euo pipefail
          test "${{ steps.vale.outcome }}" = "failure"
          test "${{ steps.vale.outputs.outcome }}" = "failure"
          test "${{ steps.vale.outputs.alerts }}" != "0"

  fixture-dirty-tolerated:
    name: bad prose passes under a higher fail-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same alerts, demoted below the bar. This pins `fail-on` as the
      # only thing separating this run from the red one above.
      - id: vale
        uses: ./
        with:
          config: fixtures/tolerated/.vale.ini
          files: fixtures/dirty/docs
          sync: false
          comment: false
          check: false
      - name: The verdict is a pass with alerts reported
        run: |
          set -euo pipefail
          test "${{ steps.vale.outputs.outcome }}" = "success"
          test "${{ steps.vale.outputs.alerts }}" != "0"

  fixture-changed-lines:
    name: only the lines this change writes count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The control. Read whole, the fixture carries six alerts across two
      # files, and this run says six. It also leaves `vale` on PATH for the
      # steps below, which is what installing it inside the action is for.
      - id: whole
        continue-on-error: true
        uses: ./
        with:
          config: fixtures/dirty/.vale.ini
          files: fixtures/dirty/docs
          sync: false
          comment: false
          check: false
      - name: Every line of every file linted
        run: test "${{ steps.whole.outputs.alerts }}" = "6"

      # A fixture pull request that touches one line of a file which is already
      # red. The alerts it inherited are counted, named, and left out of the
      # verdict, which is the whole point: a gate that goes red over debt the
      # change did not write is a gate people route around.
      - name: A pull request whose line the rules say nothing about
        id: clean-edit
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/vale_action.py resolve-files \
            --files-json fixtures/dirty/files-touching-a-clean-line.json \
            --lines-out "$RUNNER_TEMP/lines.json" > "$RUNNER_TEMP/list.txt"
          vale --no-global --config=fixtures/dirty/.vale.ini --output=JSON \
            "$(cat "$RUNNER_TEMP/list.txt")" > "$RUNNER_TEMP/raw.json" || status=$?
          python3 scripts/vale_action.py report \
            --stdout "$RUNNER_TEMP/raw.json" \
            --status "${status:-0}" \
            --fail-on error \
            --version "${{ steps.whole.outputs.vale-version }}" \
            --files 1 \
            --changed-lines "$RUNNER_TEMP/lines.json" \
            --comment false \
            --check false
      - name: The check passes and the inherited alerts are named
        run: |
          set -euo pipefail
          test "${{ steps.clean-edit.outcome }}" = "success"
          test "${{ steps.clean-edit.outputs.alerts }}" = "0"
          test "${{ steps.clean-edit.outputs.ignored }}" = "3"
          # The wording of that naming is pinned by the unit tests, which can
          # read the body the report wrote; a step summary belongs to the step
          # that wrote it and is not readable from the next one.

      # And the same shape the other way: the line this fixture pull request
      # writes is one the rules object to. Narrowing must not become a way for
      # a new alert to reach main unremarked.
      - name: A pull request whose line the rules object to
        id: alert-edit
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/vale_action.py resolve-files \
            --files-json fixtures/dirty/files-touching-an-alert.json \
            --lines-out "$RUNNER_TEMP/lines.json" > "$RUNNER_TEMP/list.txt"
          vale --no-global --config=fixtures/dirty/.vale.ini --output=JSON \
            "$(cat "$RUNNER_TEMP/list.txt")" > "$RUNNER_TEMP/raw.json" || status=$?
          python3 scripts/vale_action.py report \
            --stdout "$RUNNER_TEMP/raw.json" \
            --status "${status:-0}" \
            --fail-on error \
            --version "${{ steps.whole.outputs.vale-version }}" \
            --files 1 \
            --changed-lines "$RUNNER_TEMP/lines.json" \
            --comment false \
            --check false
      - name: The check fails on the line the change wrote
        run: |
          set -euo pipefail
          test "${{ steps.alert-edit.outcome }}" = "failure"
          test "${{ steps.alert-edit.outputs.alerts }}" = "1"
          test "${{ steps.alert-edit.outputs.ignored }}" = "2"

  fixture-broken:
    name: a linter that could not run does not pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: vale
        continue-on-error: true
        uses: ./
        with:
          config: fixtures/broken/.vale.ini
          files: fixtures/broken/docs
          sync: false
          comment: false
          check: false
      - name: The step went red and says the linter could not run
        run: |
          set -euo pipefail
          test "${{ steps.vale.outcome }}" = "failure"
          test "${{ steps.vale.outputs.outcome }}" = "error"

  fixture-styles-input:
    name: an extra styles directory is added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The clean fixture's prose is clean only against the clean fixture's
      # rules. Inject one more rule and it has to go red.
      - id: vale
        continue-on-error: true
        uses: ./
        with:
          config: fixtures/clean/.vale.ini
          files: fixtures/clean/docs
          styles: fixtures/extra-styles
          sync: false
          comment: false
          check: false
      - name: The injected rule fired
        run: |
          set -euo pipefail
          test "${{ steps.vale.outputs.outcome }}" = "failure"
